<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="按 195 个国家/地区 1900–2100 年的真实统计随机出生，过完一生的人生模拟。">
<meta name="theme-color" content="#8C1D36">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>此生生命表</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>/* Layout: one life = one ledger sheet. Single column, ruled rows, numerals in mono; a control dock pinned to the bottom during a life. */
:root{
  --paper:#F4F1EB; --sheet:#FBFAF7; --ink:#13212A; --mute:#4F5E65; --rule:#DCD6CB;
  --accent:#1F6B5C; --accent-soft:#DDE8E3; --on-accent:#FFFFFF;
  --red:#8C1D36; --red-soft:#F1DEE2; --on-red:#FFFFFF;
  --gold:#9A6B12; --good:#2D7A4C; --bad:#B23A2B; --warn:#B07A10; --candle:#C98A1A;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#11181C; --sheet:#182227; --ink:#E6E2DA; --mute:#9AA6AA; --rule:#2C383D;
  --accent:#5FB39F; --accent-soft:#1E3631; --on-accent:#0B201B;
  --red:#E0647D; --red-soft:#3A1C24; --on-red:#1E0A10;
  --gold:#D8A847; --good:#5BBA82; --bad:#E7765C; --warn:#E0AE4A; --candle:#F0B44A; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#11181C; --sheet:#182227; --ink:#E6E2DA; --mute:#9AA6AA; --rule:#2C383D;
  --accent:#5FB39F; --accent-soft:#1E3631; --on-accent:#0B201B;
  --red:#E0647D; --red-soft:#3A1C24; --on-red:#1E0A10;
  --gold:#D8A847; --good:#5BBA82; --bad:#E7765C; --warn:#E0AE4A; --candle:#F0B44A; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 150px}
.wrap{max-width:740px;margin:0 auto}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1.5px solid var(--red);background:var(--red);color:var(--on-red);padding:.6em 1.2em;border-radius:var(--r);font-weight:700;letter-spacing:.04em}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.big{font-size:21px;padding:.7em 2.8em;font-family:var(--f-display);font-weight:900;letter-spacing:.3em;border-radius:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--rule);background:var(--sheet);padding:.32em .8em;border-radius:999px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lbl{font-size:12px;letter-spacing:.12em;color:var(--mute);font-weight:500}
.muted{color:var(--mute)} .small{font-size:13px} .xs{font-size:12px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:.45em .6em;max-width:100%}
textarea{width:100%;min-height:70px;resize:vertical}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline;text-underline-offset:3px}

/* masthead */
.mast{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-block:16px 10px;border-bottom:1px solid var(--rule)}
.mark{font-family:var(--f-display);font-weight:900;font-size:22px;color:var(--ink);letter-spacing:.08em;border:0;background:none;padding:0}
.nav{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:13px}
.nav button{border:0;background:none;padding:2px 0;color:var(--mute)}
.nav button[aria-current="page"]{color:var(--ink);font-weight:700}
.page{padding-block:22px;display:grid;gap:26px}
.page>section{display:grid;gap:12px}
.hero{display:grid;gap:20px;padding-top:10px}
.hero h1{font-size:clamp(34px,9vw,64px);font-weight:900;line-height:1.12;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--red)}
.counters{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.counters div{padding:14px 0;display:grid;gap:2px;min-width:0}
.counters div+div{border-left:1px solid var(--rule);padding-left:16px}
.counters b{font-family:var(--f-display);font-size:clamp(32px,9vw,52px);font-weight:900;line-height:1.05}
.counters .c1{color:var(--red)}
.counters span{font-size:13px;color:var(--mute)}
.lede{max-width:62ch}
.h2{font-family:var(--f-display);font-size:22px;font-weight:900;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-bottom:2px}
.h2 .linkbtn{font-family:var(--f-body);font-size:13px;font-weight:400}
.probs{display:grid;gap:6px}
.prob{display:grid;grid-template-columns:6.5em 1fr 3.6em;gap:10px;align-items:center;font-size:14px}
.prob .bar{height:10px}
.setup{display:grid;gap:18px;padding:22px 18px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
.row{display:grid;gap:8px}
.row .hint{font-size:13px;color:var(--mute)}
.warnline{font-size:13px;color:var(--mute);border-left:3px solid var(--warn);padding-left:10px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.cards{display:grid;gap:10px}
.mcard{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;text-align:left;width:100%}
.mcard .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mcard .t b{font-family:var(--f-display);font-size:18px;font-weight:900}
.mcard .s{font-size:13px;color:var(--mute)}
.mcard .q{font-family:var(--f-display);font-size:14px}
.candles{color:var(--candle);font-family:var(--f-num);font-size:13px;white-space:nowrap}
.flame{display:inline-block;width:7px;height:11px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:var(--candle);margin-right:4px;vertical-align:-1px}
details.about{border-top:1px solid var(--rule);padding-block:14px;font-size:13px;color:var(--mute)}
details.about summary{cursor:pointer;color:var(--ink);font-weight:500}
details.about p{margin-top:10px;max-width:68ch}
.foot{border-top:1px solid var(--rule);padding-block:18px;font-size:12px;color:var(--mute);display:grid;gap:10px}

/* draw + registration */
.draw{min-height:60vh;display:grid;place-items:center;text-align:center;gap:10px;padding-block:40px}
.draw .spin{font-family:var(--f-display);font-size:clamp(40px,12vw,76px);font-weight:900;color:var(--red)}
.reg,.cert{margin-block:24px;background:var(--sheet);border:1px solid var(--rule);box-shadow:0 2px 10px rgba(0,0,0,.05);border-radius:var(--r);padding:22px 20px;display:grid;gap:16px}
.reg h2,.cert h2{font-size:24px;font-weight:900;letter-spacing:.4em;text-align:center}
.form{display:grid;grid-template-columns:auto 1fr;border-top:1px solid var(--rule)}
.form>div{padding:8px 0;border-bottom:1px solid var(--rule)}
.form>div:nth-child(odd){color:var(--mute);font-size:13px;padding-right:16px;white-space:nowrap}
.form>div:nth-child(even){font-weight:500;min-width:0}
.namebox{display:flex;gap:8px;flex-wrap:wrap}
.namebox input{flex:1;min-width:0}

/* game */
.idbar{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;padding-block:14px 10px;border-bottom:1px solid var(--rule)}
.who{min-width:0}
.who .nm{font-family:var(--f-display);font-size:28px;font-weight:900}
.who .meta{font-size:13px;color:var(--mute)}
.agebox{text-align:right;line-height:1;min-width:6em}
.agebox>.num{font-family:var(--f-display);font-size:60px;font-weight:900;color:var(--red)}
.agebox small{font-size:14px;margin-left:2px}
.agebox .yr{font-size:12px;color:var(--mute);margin-top:4px}
.yearbar{height:3px;background:var(--accent-soft);margin-top:6px;border-radius:2px;overflow:hidden}
.yearbar i{display:block;height:100%;background:var(--accent);width:0}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;padding-block:12px}
.stat{display:grid;grid-template-columns:3em 1fr 2.2em;align-items:center;gap:8px;font-size:13px}
.bar{height:8px;background:var(--accent-soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
.bar.low i{background:var(--bad)}
.stat .num{text-align:right}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.kpis>div{padding:8px 0;min-width:0}
.kpis>div+div{border-left:1px solid var(--rule);padding-left:12px}
.kpis b{display:block;font-family:var(--f-num);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis span{font-size:12px;color:var(--mute)}
.event{margin-block:14px;background:var(--sheet);border:1.5px solid var(--red);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.event .tag{display:inline-block;font-size:11px;letter-spacing:.2em;color:var(--on-red);background:var(--red);border:1px solid var(--red);padding:1px 7px;border-radius:3px;justify-self:start}
.event h3{font-size:22px;font-weight:900}
.event .opts{display:grid;gap:8px}
.event .opt{text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:var(--r);padding:10px 12px;display:grid;gap:2px}
.event .opt:hover:not(:disabled){border-color:var(--red);background:var(--red-soft)}
.event .opt b{font-weight:700}
.event .opt span{font-size:12.5px;color:var(--mute)}
.event.soft{border-style:dashed}
.helpnote{font-size:12.5px;color:var(--mute);border-left:3px solid var(--accent);padding-left:10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);overflow-x:auto;margin-top:14px}
.tabs button{border:0;background:none;padding:10px 12px;font-size:14px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--red);border-bottom-color:var(--red);font-weight:700}
.panel{padding-block:16px;display:grid;gap:18px}
.sec{display:grid;gap:8px;min-width:0}
.sec>h4{margin:0;font-size:12px;letter-spacing:.14em;color:var(--mute);font-weight:500}
.log{list-style:none;margin:0;padding:0;font-size:14px}
.log li{display:grid;grid-template-columns:3.4em 1fr 1.2em;gap:8px;padding:6px 0;border-bottom:1px dashed var(--rule);cursor:pointer}
.log li .num{color:var(--mute);font-size:12px;padding-top:2px;line-height:1.3}
.log li .num small{font-size:11px;opacity:.8}
.log li .star{color:var(--gold);text-align:right}
.log li.k-choice{color:var(--mute);font-size:13px}
.log li.k-death span:nth-child(2){color:var(--bad)}
.log li.k-world span:nth-child(2){font-weight:500}
.log li.k-era span:nth-child(2){color:var(--accent)}
.resume{border:1.5px solid var(--accent);border-radius:var(--r);padding:14px;display:grid;gap:8px;background:var(--sheet)}
.log li.k-note span:nth-child(2){font-family:var(--f-display)}
.log li.k-act span:nth-child(2),.log li.k-money span:nth-child(2){color:var(--gold)}
.log.static li{cursor:default}
.map{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;max-width:360px}
.map i{aspect-ratio:1;border-radius:2px;background:var(--rule);opacity:.35}
.map i.on{opacity:1}
.map i.now{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mute);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.tbl{display:grid;grid-template-columns:1fr auto;font-size:14px}
.tbl>div{padding:7px 0;border-bottom:1px solid var(--rule);min-width:0}
.tbl>div:nth-child(even){text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;padding-left:10px}
.neg{color:var(--bad)} .pos{color:var(--good)}
.card{border:1px solid var(--rule);border-radius:var(--r);padding:14px;background:var(--sheet);display:grid;gap:10px}
.card h5{margin:0;font-size:18px;font-weight:900;font-family:var(--f-display)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions button{border:1px solid var(--ink);background:transparent;border-radius:var(--r);padding:.4em .9em;font-size:13px}
.actions button.pri{background:var(--red);border-color:var(--red);color:var(--on-red)}
.formula{font-family:var(--f-num);font-size:12.5px;color:var(--mute);overflow-x:auto;white-space:nowrap}
.chart{width:100%;max-width:560px;height:auto;display:block}
.chart .ax{stroke:var(--rule);stroke-width:1;fill:none}
.chart .ln{stroke:var(--accent);stroke-width:2;fill:none}
.chart .ln2{stroke:var(--mute);stroke-width:1.2;fill:none;stroke-dasharray:3 3}
.chart .area{fill:var(--accent-soft);stroke:none}
.chart .now{stroke:var(--ink);stroke-width:1.2}
.chart .dot{fill:var(--bad)}
.chart .me{fill:var(--ink)}
.chart text{fill:var(--mute);font-size:10px;font-family:var(--f-num)}
.peer{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px}
.peer .pn{font-weight:700}
.peer .ps{grid-column:1/-1;color:var(--mute);font-size:13px}
.peer.dead .pn{text-decoration:line-through;text-decoration-color:var(--bad)}
.pill{display:inline-block;font-size:11px;padding:0 7px;border-radius:999px;border:1px solid currentColor;margin-left:6px;vertical-align:1px}
.pill.good{color:var(--good)} .pill.bad{color:var(--bad)} .pill.gold{color:var(--gold)}
.spendgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.spendgrid button{text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:8px 10px;display:grid;gap:2px;font-size:13px}
.spendgrid button span{font-family:var(--f-num);color:var(--mute);font-size:12px}
.tablewrap{overflow-x:auto;border-top:1px solid var(--ink)}
table.st{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
table.st th,table.st td{padding:7px 8px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
table.st th:first-child,table.st td:first-child{text-align:left}
table.st th{font-weight:500;color:var(--mute);font-size:12px;cursor:pointer;position:sticky;top:0;background:var(--paper)}
table.st td{font-family:var(--f-num);font-variant-numeric:tabular-nums}
table.st td:first-child{font-family:var(--f-body)}
code.xfer{display:block;font-family:var(--f-num);font-size:11px;word-break:break-all;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:8px;max-height:140px;overflow:auto}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--rule);box-shadow:0 -4px 16px rgba(0,0,0,.06);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock .in{max-width:740px;margin:0 auto;display:grid;gap:8px}
.dock .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.dock .play{min-width:5em}
.dock .more{display:flex;gap:6px;flex-wrap:wrap}
.dock .more button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:.25em .8em;font-size:12.5px}
.dock .more #nowPlaying{align-self:center;padding-left:4px}
.btn.ghost[aria-pressed="true"]{border-color:var(--red);color:var(--red)}
.dock .more button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}

.epitaph{font-family:var(--f-display);font-size:clamp(26px,7vw,36px);font-weight:900;text-align:center;text-wrap:balance}
.big-stat{font-family:var(--f-display);font-size:44px;font-weight:900;color:var(--red)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:var(--r);font-size:13px;z-index:30;max-width:90vw}
@media (max-width:480px){ .statgrid{grid-template-columns:1fr} .agebox>.num{font-size:44px} .prob{grid-template-columns:5.5em 1fr 3.4em} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

.budget{display:grid;gap:8px}
.brow{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:6px 0;border-bottom:1px dashed var(--rule)}
.brow .bn{display:grid;min-width:0}
.event .opt em.fx,.spendgrid em.fx{font-style:normal;font-weight:500;font-size:12px;color:var(--accent);margin-left:6px}

.agegate{border:1.5px solid var(--red);background:var(--red-soft);border-radius:var(--r);padding:14px;display:grid;gap:10px}

.stat .sub{grid-column:2/-1;font-size:11px;color:var(--mute);margin-top:-4px}
.needs{display:grid;gap:6px}
.nrow{display:grid;grid-template-columns:minmax(0,1.6fr) 1fr 2.2em 3.2em;gap:8px;align-items:center;font-size:13px}
.nrow .nn{display:grid;min-width:0}
.nrow .num{text-align:right}

.ltitle{font-family:var(--f-display);font-weight:900;font-size:22px;color:var(--red);text-align:center;margin:0}
.epi{text-align:center;color:var(--mute);font-size:14px;max-width:46ch;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:1px 10px;font-size:13px}
.wishes{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.wishes li.done{color:var(--red);font-weight:700}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{border:1px dashed var(--rule);border-radius:var(--r);padding:8px 10px;display:grid;gap:2px;color:var(--mute);font-size:12px}
.ach b{font-size:14px;color:var(--mute)}
.ach.on{border-style:solid;border-color:var(--red);background:var(--red-soft);color:var(--ink)}
.ach.on b{color:var(--red)}
.chart .cp{stroke:var(--red);stroke-width:2;fill:none}
.chart .ch{stroke:var(--accent);stroke-width:1.6;fill:none}
.chart .cw{stroke:var(--gold);stroke-width:1.2;fill:none;stroke-dasharray:4 3}
/* 修仙 */
.xian .xh{font-family:var(--f-display);font-size:30px;font-weight:900;letter-spacing:.2em}
.xcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;padding-block:8px}
.xcard{display:grid;gap:4px;text-align:left;padding:10px 12px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);color:var(--ink);font:inherit;cursor:pointer}
.xcard b{font-size:15px}
.xcard.r1{border-color:#3d6fb0}.xcard.r1 b{color:#3d6fb0}
.xcard.r2{border-color:#b8860b;box-shadow:0 0 0 1px #b8860b inset}.xcard.r2 b{color:#b8860b}

function retire(L,c){if(L.job)L.lastWage=wage(L,c);L.job=null;L.retired=true;const p=pension(L,c);log(L,p>c.g*.1?`退休了。每年退休金约 ${fmtMoney(p)}。`:'不再干活了，晚年主要靠家里和积蓄。','work');}

function money(L,c){

  L.flags.career=0;for(const x of bud)if(x.lv)SPCAT[x.k].fx(L,c,x.lv*bf);cons+=bsum*bf;

  else if(L.flags.bk&&L.age-L.flags.bk>=10)L.flags.bk=0;if(L.flags.shark&&M.debt<c.g*.05)L.flags.shark=0;

function termQuote(L,c,S){
  const T=table(L.cur,L.sex,sYear(L)),x=L.age,n=Math.min(20,Math.max(0,65-x)),m=riskMult(L,c);
  const cls=m<1.25?1:m<1.75?1.5:m<2.5?2:m<3.5?3:null;
  if(!cls||n<5)return{n,m,cls:null};
  const ins=epv(T,x,n,cls,.03),me=epv(T,x,n,m,.03);
  const net=S*ins.A/ins.a,P=net*1.25;
  return{n,m,cls,A:ins.A,a:ins.a,net,P,mwr:S*me.A/(P*me.a)};
}
function annQuote(L,c,prem){
  const T=table(L.cur,L.sex,sYear(L)),x=L.age,n=111-x,m=riskMult(L,c);
  const ins=epv(T,x,n,.85,.03),me=epv(T,x,n,m,.03);
  const pay=prem/(ins.a*1.06);
  return{pay,a:ins.a,ame:me.a,mwr:pay*me.a/prem,m};
}
function persEx(L,c){const T=table(L.cur,L.sex,sYear(L)),m=riskMult(L,c);let S=1,e=0;for(let x=L.age;x<=110;x++){const q=1-Math.pow(1-T.q[x],m);e+=S-S*q*.5;S*=1-q;}return e;}

    if(a>=10&&a<=13&&L.school&&!L.flags.childWork&&!L.flags.cwAsk&&c.g<6000&&L.fpct<.35&&rnd()<.25){L.flags.cwAsk=1;queue(L,{title:'家里缺人手',text:'家里太穷了，需要你去干活挣钱。当时当地很多孩子这个年纪就开始工作。',opts:[

    if(L.flags.childWork&&a>=15){L.flags.childWork=0;}
    if(L.school&&a>=8&&a<=15&&!L.flags.bully&&L.st.social<45&&rnd()<.07){L.flags.bully=1;queue(L,{title:'在学校被欺负',text:'几个同学总是找你麻烦，抢你的东西，在背后笑你。',opts:[
      {t:'告诉老师和家长',w:1.5,f:L=>{if(rnd()<.55)log(L,'大人出面后，欺负停了。','edu');else{log(L,'告诉了大人，情况却没有变好。','edu');bump(L,'happy',-5);}}},
      {t:'还手',w:.6,f:L=>{if(rnd()<.5){bump(L,'social',4);log(L,'打了一架之后，他们不敢再惹你。','edu');}else{bump(L,'health',-5);log(L,'打架吃了亏，还被学校处分。','edu');}}},
      {t:'忍着',w:1,f:L=>{bump(L,'happy',-8);bump(L,'know',-2);}}]});}
    if(L.sibs>0&&rnd()<table(L.born,'M',sYear(L)).q[a]*L.sibs*.9){L.sibs--;log(L,'你的一个兄弟姐妹去世了。','death');bump(L,'happy',-10);}
    if(heavy&&F&&a>=15&&a<=17&&!(L.partner&&L.partner.st==='mar')&&!L.flags.teenPreg&&rnd()<c.tf/1000*.5){L.flags.teenPreg=1;queue(L,evTeenPreg(L,c));}
  }else{
    if(heavy&&F&&a<=19&&!(L.partner&&L.partner.st==='mar')&&!L.flags.teenPreg&&rnd()<c.tf/1000*.5){L.flags.teenPreg=1;queue(L,evTeenPreg(L,c));}
  }

  const cs=CONSCRIPT[L.cur];
  if(cs&&!F&&!L.flags.served&&a>=cs[0]&&!L.school&&a<=28&&!(L.flags.disabled)){L.flags.served=1;L.flags.army=a+Math.round(cs[1]);if(L.job&&!L.job.own)L.job=null;log(L,`${cs[2]} ${cs[1]} 年。`,'world');bump(L,'social',3);bump(L,'happy',-3);}
  if(L.flags.army===a){log(L,'退伍了。','world');}
  // prison release
  if(L.flags.prison===a){log(L,'刑满释放。重新开始并不容易。','world');L.flags.record=1;}
  if(L.flags.prison>a){bump(L,'social',-3);bump(L,'happy',-3);if(L.partner&&L.partner.alive)L.partner.rel=clamp(L.partner.rel-6,0,100);}
  // abroad labor end
  if(L.flags.abroad===a){log(L,'合同到期，你回到了家乡。','work');bump(L,'social',3);}
  if(L.flags.abroad>a&&L.partner&&L.partner.alive)L.partner.rel=clamp(L.partner.rel-3,0,100);
  // depression onset & recovery
  if(a>=12){
    if(!L.flags.dep&&(L.st.mind??L.st.happy)<30&&rnd()<.3){L.flags.dep=1;queue(L,evDep(L,c));}
    else if(L.flags.dep){if((L.st.mind??L.st.happy)>55||rnd()<(L.flags.treat?.3:.12)){L.flags.dep=0;log(L,'压在心里很久的那层灰，慢慢散了。','health');}else bump(L,'happy',-3);}

  for(const d of[dz,fl,stm,dr].filter(Boolean)){

      const H=L.money.house;if(H)H.value*=d[0]==='干旱'?.95:.7;L.money.liq*=1-.25*poor;bump(L,'health',-4);bump(L,'happy',-6);

      if(d[0]==='干旱'&&L.rural&&a>=16&&rnd()<.4){L.rural=false;log(L,'活不下去了，你离开家乡去城里谋生。','world');}
      break;
    }
  }
  if(a<16)return;
  // crime: victim
  if(rnd()<c.hom/600){const loss=Math.min(L.money.liq*.1,c.g*.2);L.money.liq-=loss;bump(L,'happy',-4);log(L,pick(['走在路上被抢了。','家里遭了贼。','手机和钱包被偷了。']),'world');}
  // crime: prison
  if(!L.flags.prison||L.flags.prison<a){const pp=(L.drugs?.06:0)+(L.gamble?.015:0)+(L.alc>=2?.01:0)+.0012*Math.max(.3,c.hom/5)*(L.sex==='M'?1.6:.3)*(L.fpct<.3?1.8:.8);
    if(heavy&&a<=60&&rnd()<pp){const n=1+Math.floor(rnd()*(L.drugs?6:4));L.flags.prison=a+n;if(L.job){L.job=null;}log(L,`你被捕了，判刑 ${n} 年。${L.drugs?'罪名和毒品有关。':pick(['罪名是盗窃。','罪名是斗殴伤人。','罪名是诈骗。','罪名是醉驾。'])}`,'world');bump(L,'happy',-15);}}
  // sexual violence (adults only), non-graphic
  if(heavy&&a>=18&&a<=60&&!L.flags.sv&&rnd()<(F?.0045:.0008)){L.flags.sv=1;queue(L,{title:'那一天',text:'你遭受了性侵害。这不是你的错。',help:HELP_SV,opts:[
    {t:'报警',w:1,f:L=>{bump(L,'happy',-14);log(L,rnd()<.3?'报了警。那个人最后被判了刑。':'报了警，但最后没能立案。','world');}},
    {t:'告诉信任的人，找专业机构帮助',w:1.2,f:L=>{bump(L,'happy',-10);bump(L,'social',2);log(L,'在别人的陪伴下，你慢慢挺了过来。','world');}},
    {t:'不告诉任何人',w:1.2,f:L=>{bump(L,'happy',-18);bump(L,'social',-6);if(rnd()<.4){L.flags.dep=1;}}}]});}
  // workplace injury
  if(L.job&&!L.job.hi&&rnd()<.01*(c.g<20000?1.5:.6)){const sev=rnd()<.3;bump(L,'health',sev?-25:-10);if(sev){L.flags.disabled=1;}const comp=L.formal?c.g*(sev?2:.3):0;L.money.liq+=comp;log(L,`干活时出了事故，${sev?'落下了终身残疾':'受了伤，休养了好几个月'}。${comp?'拿到工伤赔偿 '+fmtMoney(comp)+'。':'老板没有赔一分钱。'}`,'health');}

  // dementia

    {t:'一个人撑着',w:.5,f:L=>{bump(L,'health',-8);}}]});}
  if(L.flags.dem){bump(L,'know',-3);if(L.flags.care===2)L.money.liq-=c.g*.5;}

    {t:'回家，和家人在一起',w:1.2,f:L=>{bump(L,'happy',8);bump(L,'social',6);log(L,'你选择回家，安静地度过剩下的日子。','health');}},
    {t:'接受安宁疗护，减轻痛苦',w:c.g>15000?1:.2,f:L=>{bump(L,'happy',6);log(L,'接受了安宁疗护。','health');}}]});}

function compileCond(spec){
  const fs=[];
  for(const tok of spec.trim().split(/\s+/).filter(Boolean)){
    let m;
    if(m=tok.match(/^a(\d+)-(\d+)$/)){const lo=+m[1],hi=+m[2];fs.push((L)=>L.age>=lo&&L.age<=hi);}
    else if(m=tok.match(/^y(\d+)-(\d+)$/)){const lo=+m[1],hi=+m[2];fs.push((L)=>{const y=yearOf(L);return y>=lo&&y<=hi;});}
    else if(m=tok.match(/^y=(\d+)$/)){const v=+m[1];fs.push(L=>yearOf(L)===v);}
    else if(m=tok.match(/^(!?)@([A-Z,]+)$/)){const neg=!!m[1],set=new Set(m[2].split(','));fs.push((L)=>set.has(L.cur)!==neg);}
    else if(m=tok.match(/^r:([A-Z,]+)$/)){const set=new Set(m[1].split(',').map(x=>REG[x]));fs.push((L,c)=>set.has(c.r));}
    else{
      const F={rural:L=>L.rural,urban:L=>!L.rural,poor:(L,c)=>c.g<4000,low:(L,c)=>c.g<12000,mid:(L,c)=>c.g>=4000&&c.g<25000,rich:(L,c)=>c.g>=25000,notpoor:(L,c)=>c.g>=4000,notrich:(L,c)=>c.g<25000,
        F:L=>L.sex==='F',M:L=>L.sex==='M',school:L=>!!L.school,noschool:L=>!L.school,uni:L=>L.school==='uni'||L.school==='grad',edu3:L=>L.edu>=3,lowedu:L=>L.edu<=1,
        job:L=>!!L.job,hijob:L=>!!(L.job&&L.job.hi),lojob:L=>!!(L.job&&!L.job.hi),nojob:L=>!L.job&&!L.school,ret:L=>L.retired,
        mar:L=>!!(L.partner&&L.partner.alive&&L.partner.st!=='dating'),dating:L=>!!(L.partner&&L.partner.alive&&L.partner.st==='dating'),single:L=>!L.partner,
        kids:L=>L.kids.some(k=>k.alive),kidsY:L=>L.kids.some(k=>k.alive&&k.age<12),kidsT:L=>L.kids.some(k=>k.alive&&k.age>=12&&k.age<19),kidsA:L=>L.kids.some(k=>k.alive&&k.age>=19),nokids:L=>!L.kids.some(k=>k.alive),
        gk:L=>L.grandkids>0,par:L=>L.father.alive||L.mother.alive,nopar:L=>!L.father.alive&&!L.mother.alive,sibs:L=>L.sibs>0,sibs3:L=>L.sibs>=3,car:L=>L.car,house:L=>!!L.money.house,nohouse:L=>!L.money.house,
        smoker:L=>L.smoker,alone:L=>!L.partner&&L.st.social<45,sick:L=>L.st.health<45,healthy:L=>L.st.health>70,happy:L=>L.st.happy>65,sad:L=>L.st.happy<35,smart:L=>L.st.know>65,
        muslim:(L,c)=>MUSLIM.has(c.k),lunar:(L,c)=>LUNAR.has(c.k),hindu:(L,c)=>HINDU.has(c.k),buddh:(L,c)=>BUDDH.has(c.k),xian:(L,c)=>(c.r===REG.EU||c.r===REG.AM)&&!MUSLIM.has(c.k)||['PH','KE','UG','ZM','ZW','AO','CD','CG','GA','RW','BI','MW','NA','BW','ZA','LS','SZ','PG','ET','GH'].includes(c.k),
        hot:(L,c)=>HOT.has(c.k),cold:(L,c)=>['RU','CA','FI','SE','NO','IS','MN','KZ','EE','LV','LT','BY','UA'].includes(c.k),wc:(L,c)=>{const y=yearOf(L);return y>=1970&&y%4===2&&(c.g>=4000||y>=1995);},market:(L,c)=>!(SOC.has(c.k)&&yearOf(L)<(c.k==='CN'||c.k==='VN'?1992:1991)),factory:L=>!!(L.job&&/工厂|普工|流水线/.test(L.job.t)),site:L=>!!(L.job&&/建筑|工地|搬运/.test(L.job.t)),
        padult:L=>!!(L.partner&&L.partner.alive&&L.partner.age>=18),intim:L=>!!L.flags.first,noteach:L=>!L.teach,lowrel:L=>!!(L.partner&&L.partner.rel<40),demo:(L,c)=>DEMOC(c),emig:L=>!!L.emig,war:L=>histEvents(L).some(h=>h.rate),crisis:L=>L.econ<.9,old:L=>L.world==='past',fut:L=>yearOf(L)>=2030,debt:(L,c)=>L.money.debt>c.g*.2,richfam:L=>L.fpct>.75,poorfam:L=>L.fpct<.3,pet:L=>!!L.pet,drink:L=>L.alc>=1,army:L=>L.flags.army>L.age,prison:L=>L.flags.prison>L.age,abroad:L=>L.flags.abroad>L.age,dep:L=>!!L.flags.dep};
      const neg=tok[0]==='!';const f=F[neg?tok.slice(1):tok];

      fs.push(neg?(L,c)=>!f(L,c):f);
    }
  }
  return(L,c)=>fs.every(f=>f(L,c));
}
function fill(t,L,c){
  const k=L.kids.filter(x=>x.alive),P=L.partner;
  return t.replace(/\{n\}/g,c.n).replace(/\{y\}/g,yearOf(L)).replace(/\{p\}/g,P?P.name:'伴侣').replace(/\{k\}/g,k.length?pick(k).name:'孩子')
   .replace(/\{par\}/g,L.father.alive&&L.mother.alive?pick(['父亲','母亲']):L.father.alive?'父亲':'母亲').replace(/\[([^\]]+)\]/g,(_,s)=>pick(s.split('|')));
}

function techTick(L,c){
  if(L.age<7)return;
  const y=yearOf(L),grp=c.g>=25000?1:c.g>=6000?2:3;
  L.tech=L.tech||{};
  for(let i=0;i<TECH.length;i++){
    if(L.tech[i])continue;
    const [t,...w]=TECH[i],[lo,hi]=w[grp-1];
    if(y<lo)continue;
    if(y>hi){L.tech[i]=1;continue;}
    const p=(y-lo+1)/(hi-lo+1)*.6*(L.rural&&grp>1?.6:1)*(L.fpct>.7?1.5:1);
    if(rnd()<p){L.tech[i]=1;log(L,t,'era');fxApply(w[3],L,c);return;}
  }
}

function momentTick(L,c){
  const y=yearOf(L);
  if(L.world==='now'&&y>2026)return;
  for(const m of MOMENTS){
    if(m[1]!==y||L.age<m[2])continue;
    if(m[0]!=='*'&&m[0]!==L.cur)continue;
    if(m[0]==='*'&&MOMENTS.some(o=>o[0]===L.cur&&o[1]===y))continue;
    log(L,fill(m[3],L,c),'era');fxApply(m[4],L,c);
  }
}

function yearlyTick(L,c){
  techTick(L,c);momentTick(L,c);pathsTick(L,c);
  if(L.flags.sentBack===yearOf(L)){L.flags.sentBack=0;L.rural=false;if(L.job&&L.job.t==='知青')L.job=null;log(L,'你终于回城了。','world');bump(L,'happy',6);}
  if(L.flags.fpFine&&L.kids.length>=2){L.flags.fpFine=0;L.money.liq-=c.g*2;if(L.job&&L.job.hi&&rnd()<.5){L.job=null;log(L,'因为超生，你丢了单位的工作。','work');}log(L,`交了 ${fmtMoney(c.g*2)} 社会抚养费。`,'money');}
  L.yeUsed=L.yeUsed||{};
  const n=L.age===0?1:1+(rnd()<.6)+(rnd()<.3);
  const pool=YE.filter(e=>(e.rep?!(L.yeUsed[e.id]>L.age-4):!L.yeUsed[e.id])&&e.f(L,c));
  for(let i=0;i<n&&pool.length;i++){
    const e=wpick(pool,x=>x.w);pool.splice(pool.indexOf(e),1);
    L.yeUsed[e.id]=L.age+1;log(L,fill(e.t,L,c),'yr');fxApply(e.fx,L,c,.5);
  }
}

// --- title and epitaph, written from what actually happened
function lifeTitle(L,avgHp){
  if(L.age<5)return'来不及长大的孩子';
  if(L.flags.fame)return`小有名气的${L.flags.fame}`;
  if(L.flags.pol===2)return'走进国会的人';
  if(L.flags.pol)return'为乡亲奔走的议员';
  if(L.fpct<.2&&L.flags.wasRich)return'白手起家';
  if(L.world==='past'&&L.flags.warSeen&&L.age>=60)return'从战火里走出来的人';
  if(L.emig)return'远走他乡的人';
  if(L.grandkids>=8)return'儿孙满堂';
  if(L.flags.prison)return'走过弯路的人';
  if(L.age>=95)return'看过一个世纪风景的人';
  if(avgHp>=72)return'平凡而幸福的一生';
  if(avgHp<35)return'在苦难里熬过来的人';
  if(L.marriages===0&&L.age>=50)return'一个人走完的一生';
  return'认真活过的一生';
}
function lifeEpitaph(L,avgHp){
  const c=CS(L.born,L.world==='now'?2025:L.by),decade=Math.floor(L.by/10)*10;
  const a=`${c.n}的${decade}年代生人`;
  const b=L.age<5?'只在这个世界上停留了很短的时间':`${EDU[L.edu]}${L.job?'，做过'+jobName(L.job):L.retired?'，安稳退休':''}`;
  const d=L.age<16?'':L.marriages?(L.kids.length?`，有${L.kids.length}个孩子`:'，没有孩子'):'，一生未婚';
  const end=L.age<5?'愿你下一次来，能看到更多的春天。':pick(avgHp>=65?['这一生，没有白来。','爱过，也被爱过。','走的时候，身边有人握着手。']:avgHp>=45?['日子有苦有甜，总算走完了。','平平常常，也是一生。','累了一辈子，终于可以歇歇了。']:['愿来世，生在一个好一点的地方。','这一生太难了，辛苦了。','熬过了那么多，现在可以放下了。']);
  return`${a}，${b}${d}。${end}`;
}

  r.flags={metPeer:!!L.flags.metPeer,lottery:L.log.some(e=>/彩票中了/.test(e.t)),quit:L.log.some(e=>/戒烟成功/.test(e.t)),pet:!!L.pet||L.log.some(e=>/养了一只|多了一只猫/.test(e.t)),war:!!L.flags.warSeen,lateLove:L.log.some(e=>/和.*结婚了/.test(e.t)&&e.a>=60),insured:!!L.ins.term||L.log.some(e=>/投保定期寿险/.test(e.t)),annuity:L.ins.annPaid>0,bk:L.log.some(e=>/申请了破产/.test(e.t)),wasRich:!!L.flags.wasRich,boss:!!L.flags.wasBoss,pol:L.flags.pol||0,fame:!!L.flags.fame,emig:!!L.emig,fpct:L.fpct,teach:!!L.teach,dep:L.log.some(e=>/走出了低谷|那层灰/.test(e.t))};

function aiRisk(car,y){const d=AIDEC[car.k]||OLDDEC[car.k];if(!d||y<=d[0])return 0;return d[2]*clamp((y-d[0])/(d[1]-d[0]),0,1);}
function boom(car,y){if(car.boom&&car.from)return car.boom*clamp(1-(y-car.from)/20,0,1);if(car.boom2&&y>car.boom2)return Math.min(.25,(y-car.boom2)*.01);return 0;}
const riskTag=r=>r>=.55?'被AI/机器替代的风险：高':r>=.25?'被替代的风险：中':r>0?'被替代的风险：低':'';
const CAR=Object.fromEntries(CAREERS.map(c=>[c.k,c]));
function ladOf(car,J){if(!car.fork)return car.lad;const f=car.fork;return car.lad.slice(0,f.at).concat(J&&J.br==='t'?f.t:f.m);}
function careerOf(L){return L.job&&L.job.ck?CAR[L.job.ck]:null;}
const L_certs=L=>L.certs||(L.certs={});
function certOk(L,car,lvl){if(!car.cert)return true;const need=(car.cert.gate||{})[lvl];return !need||(L_certs(L)[car.k]||0)>=need;}
function pubOk(L,car,lvl){if(!car.pub)return true;const need=car.pub[lvl];return !need||(L.pubs||0)>=need;}
// names
const _jobName=jobName;
jobName=function(J){if(J&&J.ck&&!J.own&&CAR[J.ck]){const lad=ladOf(CAR[J.ck],J);return lad[Math.min(J.lvl,lad.length-1)];}return _jobName(J);};
// pay
const _wage=wage;
wage=function(L,c){const J=L.job;if(!J||!J.ck||J.own)return _wage(L,c);const car=CAR[J.ck],keep=J.lvl;J.lvl=1;let w=_wage(L,c);J.lvl=keep;
  const yy=yearOf(L);return w*Math.exp(sig(c)*(.12-aiRisk(car,yy)*.5+boom(car,yy)+car.b+(keep-1)*car.st+(L.flags.mba?.1:0)));};
// ---------- finding a job: offers ----------
function eligible(L,c){const y=yearOf(L);return CAREERS.filter(car=>L.edu>=car.edu[0]&&L.edu<=Math.max(car.edu[1],car.edu[0])&&(!car.maj||L.edu<3||car.maj.includes(L.major)||car.edu[0]<3)&&(!car.ok||car.ok(L,c,y))&&!(car.from&&y<car.from)&&!(car.to&&y>car.to)&&aiRisk(car,y)<.88&&!(L.flags.civFail===y&&car.exam));}
function offerW(L,c,car){let w=car.w;if(car.edu[0]<L.edu)w*=L.edu>=3?.12:.4;if(car.sx&&car.sx!==L.sex)w*=.25;if(car.k==='farm')w*=1+c.agr/20;{const y=yearOf(L);w*=Math.pow(1-aiRisk(car,y),2)*(1+boom(car,y)*6);if(car.to&&y>car.to-8)w*=.4;}if(L.edu>=3&&car.maj&&car.maj.includes(L.major))w*=1.6;if(L.cv&&L.cv[car.k])w*=3;if(L.age>40&&!(L.cv&&L.cv[car.k])&&['ib','swe','data','pm','anchor','actuary','lawyer','prof'].includes(car.k))w*=.15;return w;}
function estPay(L,c,car,lvl){const old=L.job;L.job={t:car.n,ck:car.k,lvl,yrs:0,z:0,own:null,hi:car.hi};const w=wage(L,c);L.job=old;return w;}
function startLvl(L,car){if(L.cv&&L.cv[car.k])return Math.max(0,L.cv[car.k]-1);if(car.k==='civil'&&L.edu>=3)return 1;if(car.k==='farm'&&L.age>=22)return 1;return 0;}
function takeJob(L,car,lvl,z){L.job={t:car.n,ck:car.k,lvl:lvl==null?startLvl(L,car):lvl,yrs:0,ly:0,z:z==null?randn()*.22:z,own:null,hi:car.hi};
  const c=cNow(L);L.formal=L.formal||c.g>30000||(L.edu>=2&&rnd()<.3+c.g/50000)||car.k==='civil';L.flags.unemp=0;
  log(L,`开始工作：${car.f} · ${jobName(L.job)}。`,'work');}
function civExamP(L){return clamp(.06+(L.st.know-50)*.006+L.edu*.03+(L.focus==='study'?.06:0),.03,.45);}
function evOffers(L,c,title,why){
  const el=eligible(L,c);if(!el.length)return null;const pool=[...el],offers=[];
  while(offers.length<3&&pool.length){const car=wpick(pool,x=>offerW(L,c,x));offers.push(car);pool.splice(pool.indexOf(car),1);}
  return{title:title||'找工作',text:why||`你在找工作。${L.edu>=3?'带着'+(L.major?MAJ[L.major].n:'')+'的文凭，':''}眼下摆在面前的有这几条路：`,opts:[
    ...offers.map(car=>{const lv=startLvl(L,car),est=estPay(L,c,car,lv),top=estPay(L,c,car,ladOf(car,null).length-1);
      if(car.exam){const p=civExamP(L);return{t:`报考${car.n}`,d:`录取率约 ${Math.round(p*100)}% · 起薪约 ${fmtMoney(est)}/年 · ${car.d}`,w:offerW(L,c,car),f:L=>{if(rnd()<p){takeJob(L,car);log(L,'笔试、面试、政审，一路过关，你上岸了。','work');}else{L.flags.civFail=yearOf(L);log(L,'考公没有考上。','work');}}};}
      const rt=riskTag(aiRisk(car,yearOf(L)+10)),nw=car.from&&yearOf(L)-car.from<8?'新兴职业 · ':'';return{t:`${car.f} · ${ladOf(car,null)[lv]}`,d:`${nw}起薪约 ${fmtMoney(est)}/年，做到顶约 ${fmtMoney(top)}/年 · ${car.d}${rt?' · 十年后'+rt:''}`,w:offerW(L,c,car),f:L=>takeJob(L,car)};}),
    {t:'都不太满意，再找找',d:'今年没有收入',w:.15,f:L=>{L.flags.unemp=(L.flags.unemp||0)+1;log(L,'你推掉了几个机会，想再找找。','work');}}]};}
const _findJob=findJob;
findJob=function(L,c){
  if(L.flags.homemaker||L.flags.prison>L.age||L.flags.army>L.age)return;
  if(L.queue.some(e=>e.offer))return;
  const p=clamp(.78-c.une/100*1.6+L.edu*.05+L.zf*.06+(L.st.know-50)*.004+(c.g>30000?.05:0)+(L.focus==='work'?.08:0)+(L.flags.career||0)*.04-(L.econ<.8?.25:0),.3,.97);
  if(rnd()>p){if(!L.flags.unemp)log(L,'找工作不顺利，暂时没有收入。','work');L.flags.unemp=(L.flags.unemp||0)+1;return;}
  const ev=evOffers(L,c);if(!ev)return _findJob(L,c);ev.offer=1;queue(L,ev);};
// ---------- promotion ----------
function promoteJob(L,why,force){const J=L.job;if(!J)return false;
  if(!J.ck){if(J.lvl<4&&!J.own){J.lvl++;log(L,`${why||'升职了'}：${jobName(J)}。`,'work');return true;}return false;}
  const car=CAR[J.ck],lad=ladOf(car,J),nx=J.lvl+1;if(nx>=lad.length||!certOk(L,car,nx)||!pubOk(L,car,nx))return false;
  if(!force&&nx>=lad.length-2&&rnd()>.3)return false;
  if(car.fork&&nx===car.fork.at&&!J.br){queue(L,guard(evFork(L,car)));return true;}
  J.lvl=nx;J.ly=0;bump(L,'happy',4);log(L,`${why||'升职了'}：${jobName(J)}。`,'work');return true;}
function cool(L,car){if(L.job)L.job.ly=Math.max(0,(car.yrs[L.job.lvl]||5)-1-Math.floor(rnd()*2));}
function evFork(L,car){const f=car.fork;return{title:'两条路',text:`做到这一步，前面分成了两条路：带团队，还是继续钻研技术？`,opts:[
  {t:`走管理线：${f.m[0]}`,d:'开会多、管人、天花板更高',w:1,f:L=>{L.job.br='m';L.job.lvl=f.at;L.job.ly=0;bump(L,'social',4);log(L,`你选择了管理线，成为${jobName(L.job)}。`,'work');}},
  {t:`走专业线：${f.t[0]}`,d:'专心做事，名额更少',w:1,f:L=>{L.job.br='t';L.job.lvl=f.at;L.job.ly=0;bump(L,'know',3);log(L,`你选择了专业线，成为${jobName(L.job)}。`,'work');}}]};}
function evPromo(L,c,car,p){const J=L.job,nx=ladOf(car,J)[J.lvl+1],g=c.g,soc=planned(L,c)||car.k==='civil';return{title:'晋升机会',text:`${nx}的位置空出来了，有几个人在争。以你现在的条件，把握大约 ${Math.round(p*100)}%。`,opts:[
  {t:'全力准备述职和答辩',d:`把握约 ${Math.round(Math.min(.95,p*1.4)*100)}%，会累`,w:1.2,f:L=>{bump(L,'health',-3);bump(L,'happy',-2);if(rnd()<p*1.4)promoteJob(L,'竞聘成功',1);else log(L,`${nx}的位置给了别人。`,'work');cool(L,car);}},
  {t:soc?'逢年过节去领导家走动走动':'找机会请老板吃饭',d:`花约 ${fmtMoney(g*.08)}，把握约 ${Math.round(Math.min(.95,p*1.6)*100)}%，有风险`,w:.6,f:L=>{L.money.liq-=g*.08;if(rnd()<.06){L.flags.record=1;bump(L,'happy',-10);log(L,'后来那位领导出了事，你也被牵连，挨了处分。','work');return;}if(rnd()<p*1.6)promoteJob(L,'升上去了',1);else log(L,'钱花了，位置还是给了别人。','work');cool(L,car);}},
  {t:'顺其自然',d:`把握约 ${Math.round(p*100)}%`,w:1,f:L=>{if(rnd()<p)promoteJob(L,'升职了',1);else log(L,`这次没轮到你。`,'work');cool(L,car);}},
  {t:'不想往上走了',d:'压力小一些',w:.3,f:L=>{L.job.noUp=yearOf(L)+5;bump(L,'happy',3);log(L,'你主动让出了机会。','work');}}]};}
// exams & papers
function evCert(L,c,car){const C=car.cert,have=L_certs(L)[car.k]||0,per=C.perY||1,p=clamp(C.p+(L.st.know-50)*.008+(L.focus==='study'?.12:0)+(hasT(L,'smart')?.08:0),.05,.92),left=C.parts-have;
  return{title:C.parts>1?`${C.n}（已过 ${have}/${C.parts} 门）`:C.n,text:C.parts>1?`下一级要求通过 ${Object.entries(C.gate).find(([lv,n])=>n>have)?.[1]||C.parts} 门。每门的通过率大约 ${Math.round(p*100)}%，备考要占掉下班后的大部分时间。`:`要再往上走，得先拿到${C.n}。按你现在的水平，通过率约 ${Math.round(p*100)}%。`,opts:[
   {t:C.parts>1?`报考 ${Math.min(per,left)} 门`:'报名考试',d:'下班复习，幸福感会受影响',w:2,f:L=>{let ok=0;for(let i=0;i<Math.min(per,left);i++)if(rnd()<p)ok++;L_certs(L)[car.k]=have+ok;bump(L,'happy',-3);bump(L,'know',2);
     if(ok)log(L,C.parts>1?`${C.n}又过了 ${ok} 门（共 ${have+ok}/${C.parts}）。${have+ok>=C.parts?'全部考完了！':''}`:`通过了${C.n}。`,'edu');else log(L,`${C.n}没考过。`,'edu');if(have+ok>=C.parts)bump(L,'happy',10);}},
   ...(C.parts>1&&per>1&&left>1?[{t:'只报 1 门，稳一点',d:'压力小',w:1,f:L=>{const ok=rnd()<p+.08;L_certs(L)[car.k]=have+(ok?1:0);log(L,ok?`${C.n}过了一门（共 ${have+1}/${C.parts}）。`:`${C.n}这门没过。`,'edu');}}]:[]),
   {t:'今年先不考',w:.5,f:L=>{}}]};}
function evPaper(L,c,car){const p=clamp(.35+(L.st.know-50)*.01+(L.focus==='work'||L.focus==='study'?.1:0),.1,.85);return{title:'论文',text:`评下一级职称要看论文（你现在有 ${L.pubs||0} 篇）。`,opts:[
  {t:'熬夜自己写',d:`发表把握约 ${Math.round(p*100)}%`,w:2,f:L=>{bump(L,'health',-2);if(rnd()<p){L.pubs=(L.pubs||0)+1;log(L,'你的论文发表了。','edu');}else log(L,'论文投了两家期刊都被拒了。','edu');}},
  {t:'和同事合作，互相挂名',d:'把握更大，篇数少算一点',w:1,f:L=>{if(rnd()<p+.2){L.pubs=(L.pubs||0)+1;log(L,'合作的论文发表了。','edu');}}},
  {t:'花钱找人“代发”',d:`约 ${fmtMoney(c.g*.15)}，有被查的风险`,w:.2,f:L=>{L.money.liq-=c.g*.15;if(rnd()<.15){L.flags.record=1;bump(L,'happy',-12);log(L,'论文被查出是代写的，你被通报批评，职称推迟评审。','work');L.job.ly=-3;}else{L.pubs=(L.pubs||0)+1;log(L,'论文“发”出来了。','edu');}}},
  {t:'今年不写',w:.6,f:L=>{}}]};}

const _career=career;
career=function(L,c){_career(L,c);const yy=yearOf(L);
  if(XIAN_ON&&!L.flags.xianSeen&&L.age>=6&&L.age<=45&&!L.queue.length&&L.alive&&rnd()<XIAN_P*(hasT(L,'lucky')?2:1)){L.flags.xianSeen=1;queue(L,evXianCall(L));}
  if(!L.job&&!L.retired&&yy>=2045&&c.g>20000&&L.age>=18&&L.age<65&&!L.school){L.money.liq+=c.g*.2;if(!L.flags.ubi){L.flags.ubi=1;log(L,'政府开始发放“基本收入”。没有工作的人，每个月也能领到一笔钱。','world');}}
  const J=L.job;if(!J||!J.ck||J.own||L.retired||!L.alive)return;const car=CAR[J.ck];if(!car)return;
  J.ly=(J.ly||0)+1;const y=yearOf(L),lad=ladOf(car,J);L.cv=L.cv||{};L.cv[car.k]=Math.max(L.cv[car.k]||0,J.lvl);
  if(car.fl.length&&rnd()<.3)log(L,pick(car.fl),'yr');
  if(L.queue.length>1)return;
  {const ar=aiRisk(car,y)*(J.aiAdapt?.4:1);if((car.to&&y>car.to)||(ar>0&&!L.queue.length&&rnd()<ar*.08)){queue(L,guard(evAI(L,c,car,ar)));return;}}
  // certificates
  const C=car.cert;if(C&&(L_certs(L)[car.k]||0)<C.parts&&L.flags.certY!==y&&J.yrs>=1&&rnd()<.75){const need=Object.keys(C.gate).map(Number).find(lv=>C.gate[lv]>(L_certs(L)[car.k]||0));if(need!=null&&J.lvl>=need-2){L.flags.certY=y;queue(L,guard(evCert(L,c,car)));return;}}
  // papers
  if(car.pub&&rnd()<.35){const nx=J.lvl+1;if(car.pub[nx]&&(L.pubs||0)<car.pub[nx]){queue(L,guard(evPaper(L,c,car)));return;}}
  // promotion
  const nx=J.lvl+1,ry=car.yrs[J.lvl]||5;
  if(nx<lad.length&&J.ly>=ry&&!(J.noUp>y)){
    if(!certOk(L,car,nx)){if(!J.hint){J.hint=1;log(L,`想升${lad[nx]}，得先通过${car.cert.n}。`,'work');}}
    else if(!pubOk(L,car,nx)){if(J.hint!==2){J.hint=2;log(L,`评${lad[nx]}需要 ${car.pub[nx]} 篇论文，你现在有 ${L.pubs||0} 篇。`,'work');}}
    else{const top=lad.length-1-nx;const p=clamp((.26+(L.st.know-50)*.005+(L.focus==='work'?.15:0)+(L.flags.career||0)*.03+(hasT(L,'social')?.05:0)+(hasT(L,'talk')?.05:0)+L.zf*.04-(L.flags.record?.15:0))*Math.pow(.7,J.lvl)*(top===0?.3:top===1?.6:1),.02,.8);
      if(nx<=2){if(rnd()<p+.15)promoteJob(L,0,1);}
      else if(rnd()<.6){queue(L,guard(evPromo(L,c,car,p)));return;}
      else if(car.upout&&J.ly>=ry+3&&J.lvl<=2&&rnd()<.5){queue(L,guard(evUpOut(L,c)));return;}}}
  // career events
  if(car.ev.length&&rnd()<.3){for(let t=0;t<3;t++){const b=CEV[pick(car.ev)];const ev=b&&b(L,c);if(ev){queue(L,guard(ev));return;}}}
  if(L.age>=26&&L.age<=48&&rnd()<.025){const ev=evSwitch(L,c);if(ev){queue(L,ev);return;}}
  if(car.hi&&L.edu===3&&!L.flags.mba&&L.age>=26&&L.age<=40&&J.lvl>=1&&rnd()<.04&&!planned(L,c))queue(L,guard(evMBA(L,c)));
};

   ${(()=>{const r=aiRisk(car,y),r10=aiRisk(car,y+10),t=riskTag(Math.max(r,r10));return t?`<p class="xs">${t}${r10>r+.05?'，而且在上升':''}${J.aiAdapt?'（你已经学会和AI一起干活，风险减半）':''}</p>`:'';})()}

  const q=(col,ord,lim)=>({orderBy:(f,d)=>q(col,[f,d||'asc'],lim),limit:n=>q(col,ord,n),
    onSnapshot(cb){const run=()=>{let docs=Object.entries(read()[col]||{}).map(([id,d])=>({id,data:()=>d}));if(ord)docs.sort((a,b)=>((a.data()[ord[0]]||0)-(b.data()[ord[0]]||0))*(ord[1]==='desc'?-1:1));if(lim)docs=docs.slice(0,lim);cb({docs});};subs.push(run);setTimeout(run,0);return()=>{};},
    add(d){const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);write(col,id,d);return Promise.resolve({id});}});

}

   <p>195 个国家/地区、1900–2100 年的人口、出生人数、分性别预期寿命、5 岁以下儿童死亡率、总和生育率、人均 GDP（购买力平价）和基尼系数来自 Gapminder（汇总联合国《世界人口展望》、世界银行、IHME 等）；未来的数值是这些机构的推估。成人平均受教育年数、吸烟率、凶杀率、HIV 感染率、孕产妇死亡率、医疗自付比例、农业就业比例、女性初婚年龄和城镇化率来自 Gapminder 的 Systema Globalis；生活满意度来自《世界幸福报告》，1989–2018 年的武装冲突死亡来自 UCDP（经 Our World in Data）。</p>
   <p>以下是估算：高等教育入学率由受教育年数和收入推算；童婚比例对主要国家采用 UNICEF 的近年数字，其余由女性初婚年龄推算，越早的年代越高；缺少的生活满意度由收入推算；1989 年以前的战争、饥荒和大流行按史料中的大致死亡规模手动设定。</p>
   <p>死亡：每个国家、性别、年份都用 5 岁以下死亡率确定婴幼儿段，5 岁以后用 Gompertz–Makeham 死亡力 μ(x)=A+B·e^(0.095x)，二分法求 B 使整张表的出生时预期寿命与数据一致。你个人的死亡率再乘上风险乘数（健康偏离同龄期望、吸烟、饮酒、药物、慢性病、收入位置）。死因按年龄、年代、收入水平和当地疾病负担抽取。收入按基尼系数换算成对数正态分布，金额以购买力平价美元计，显示为按中国物价换算的人民币体感金额。</p>
  </details>

  <details class="about"><summary>使用须知与隐私</summary><p>这是一个依据公开统计做的人生模拟，结果是随机的，不代表任何真实的人，也不是对任何国家或群体的评价。内容包含死亡、疾病、战争、成瘾、暴力和自杀等沉重情节，适合 21 岁以上；如果读到这些让你难受，请随时停下来，现实中需要帮助时请联系当地的求助热线。</p><p>${S.local?'你的人生记录、追思馆、分享和设置都只保存在这个浏览器里，不会上传到任何地方；清除浏览器数据就会消失，可以用“前世记录”里的导出代码备份。':'人生记录和设置只保存在这个浏览器里。安放到追思馆、分享人生和留言会保存在这个页面的共享数据里，有权限打开这个页面的人都能看到，但不会显示你的名字。'}</p></details>
  <div class="foot"><span>这是一个人生模拟，所有人物都是虚构的。</span>

function todayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function beginDraw(){
  if(pref.cheat){showCheat();return;}
  if(pref.daily)setSeed('life-'+todayKey());
  let world=pref.world==='any'?pick(['past','now','future']):pref.world;
  let by=+pref.by;if(!(world==='past'&&by>=1900&&by<=2025)&&!(world==='future'&&by>=2027&&by<=2100))by=0;
  by=by||rollBirthYear(world);
  G.L=newLife({world,by,mode:pref.mode,teach:pref.teach});G.L.daily=pref.daily?todayKey():null;
  if(pref.daily)unseed();
  G.peers=[0,1,2,3].map(()=>simulate(newLife({world,by,mode:pref.mode,teach:pref.teach})));
  route('draw');$('#mast').hidden=true;
  $('#view').innerHTML=`<div class="draw"><span class="lbl">${esc(by)} 年 · 正在决定出生地</span><div class="spin" id="spin">…</div></div>`;
  let i=0;const iv=setInterval(()=>{$('#spin').textContent=pick(C).n;if(++i>18){clearInterval(iv);$('#spin').textContent=cname(G.L.born);setTimeout(showRegister,700);}},80);
}

function revealAll(){const L=G.L;while(G.shown<L.log.length){if(choiceDue())return;revealOne();}if(G.pendPause&&!L.queue.length){G.soft={kind:'pause',a:G.pendPause};G.pendPause=0;}}
// put lines created by a player action at the reveal point, so the story stays in order
function inline(fn){const L=G.L,n0=L.log.length,q0=L.queue.length;fn();const add=L.log.splice(n0);const lead=n0-G.shown;L.log.splice(G.shown,0,...add);add.forEach(e=>{if(e.a===L.age&&e.m==null)e.m=clamp(Math.ceil((G.rev+1)/(G.yearN+1)*12),1,12);});G.shown+=add.length;
  L.queue.forEach((ev,i)=>{if(ev.at>=n0)ev.at=G.shown;else if(ev.at>G.shown-add.length)ev.at+=add.length;});}
function tick(){
  const now=performance.now(),dt=now-G.lastT;G.lastT=now;
  const L=G.L;if(!L||G.ended||G.page!=='game')return;
  if(!L.alive){finish();return;}
  const pr=$('#gProg');
  if(!G.playing||G.soft||G.tab==='money'){return;}
  if(choiceDue()){if(G.auto&&(G.acc2=(G.acc2||0)+dt)>Math.min(1500,msPerYear()/2)){G.acc2=0;choose(autoPick(L.queue[0]));}return;}
  G.acc+=dt;const ms=msPerYear();
  if(pr)pr.style.width=Math.min(100,G.acc/ms*100)+'%';
  const target=Math.floor(Math.min(1,G.acc/ms)*(G.yearN+1));
  let changed=false;
  while(G.shown<L.log.length&&G.rev<target){revealOne();changed=true;if(choiceDue())break;}
  if(changed){render();return;}
  if(G.acc>=ms){revealAll();if(L.queue.length||G.soft){render();return;}G.acc=0;advance();}
}

function cap(o){if(o===null||typeof o!=='object')return{p:o};if(Array.isArray(o))return{r:o,a:o.map(cap)};const m={};for(const k in o)m[k]=cap(o[k]);return{r:o,m};}
function res(c){if('p' in c)return c.p;const o=c.r;if(c.a){o.length=0;c.a.forEach(x=>o.push(res(x)));}else{for(const k of Object.keys(o))if(!(k in c.m))delete o[k];for(const k in c.m)o[k]=res(c.m[k]);}return o;}
function previewFx(L,e){if(e._fx)return e._fx;const c0=cNow(L),snap=cap(L),N=14,out=[];
  for(const o of e.opts){if(o.dis){out.push('');continue;}const d={health:0,mind:0,happy:0,know:0,social:0},base={...L.st},nw0=netWorth(L);let money=0,dead=0,rel=0;const P0=L.partner,r0=P0?P0.rel:0;
    for(let i=0;i<N;i++){try{o.f(L);}catch(err){}for(const k in d)d[k]+=(L.st[k]-base[k])/N;money+=(netWorth(L)-nw0)/N;if(!L.alive)dead++;if(P0)rel+=((L.partner===P0?P0.rel:0)-r0)/N;res(snap);}
    const t=[];const nm={health:'身体',mind:'心理',happy:'幸福',know:'知识',social:'人际'};for(const k in d)if(Math.abs(d[k])>=1.5)t.push(nm[k]+(d[k]>0?'↑':'↓'));if(Math.abs(money)>=c0.g*.05)t.push('钱'+(money>0?'↑':'↓'));if(P0&&Math.abs(rel)>=4)t.push('感情'+(rel>0?'↑':'↓'));if(dead>0)t.push('有风险');out.push(t.join(' '));}

const PRI={love:1,family:2,work:3,health:4,money:5,edu:6,world:7,era:8,act:9,yr:10,n:11,note:12};
function perYear(log,keyFn,curAge,fill=true){const out=[];let i=0;const ages=[];
  const by=new Map();for(const e of log){if(!by.has(e.a)){by.set(e.a,[]);ages.push(e.a);}by.get(e.a).push(e);}
  const last=ages.length?ages[ages.length-1]:0;const all=fill?Array.from({length:last+1},(_,a)=>a):ages;
  for(const a of all){const es=by.get(a)||[];const ks=es.filter(keyFn);if(ks.length){out.push(...ks);continue;}
    const cand=es.filter(e=>e.k!=='choice').sort((x,y)=>(PRI[x.k]||13)-(PRI[y.k]||13));
    if(cand.length)out.push(Object.assign(Object.create(cand[0]),{pick:1}));
    else if(fill&&a<last)out.push({a,k:'n',t:'这一年平平淡淡地过去了。',pick:1});}
  return out;}

  const key=pick.length+'|'+(pick.length?pick[pick.length-1].t:'')+det;if(F._k===key)return;

  F.innerHTML=`<button class="linkbtn fdet top">${det?'只看大事':'显示小事'}</button>`+h+`<button class="fnew" hidden>↓ 有新的经历</button>`;
  F.querySelector('.fdet').onclick=toggle;const nb=F.querySelector('.fnew');nb.onclick=()=>{F.scrollTop=F.scrollHeight;nb.hidden=true;};

function lifeMap(hps,now){const n=Math.max(100,Math.ceil((hps.length)/10)*10);let h='';for(let a=0;a<n;a++){const v=hps[a];h+=v!=null?`<i class="on${a===now?' now':''}" title="${a}岁" style="background:color-mix(in oklab, var(--good) ${Math.round(v)}%, var(--bad))"></i>`:'<i></i>';}return`<div class="map">${h}</div><div class="legend"><span><i style="background:var(--bad)"></i>不快乐</span><span><i style="background:var(--good)"></i>快乐</span><span>一格 = 一年</span></div>`;}
const KEYW=/开始工作|升职|晋升|竞聘成功|升上去|失业|裁|退休|创业|开了一家|关门|通过了|全部考完|转行|选择了|开除|辞职|下岗|立功|处分|判了|上岸|出国|移民|成了|被“优化”|离开了干了|这一行|破格|大案|期权|财务自由/,KEYL=/分手|分开|约会|来往|搬到一起|结婚|成亲|离婚|求婚|订婚|认真交往|离开了这段关系|发现了|再婚|去世/;

function curveSVG(hp,h,nw,now){const n=Math.max(hp.length,2),w=340,H=150,X=i=>30+i*(w-40)/Math.max(1,n-1),Y=v=>H-22-v/100*(H-34);

  const mx=Math.max(1,...nw.map(Math.abs)),YW=v=>H-22-(v/mx*.5+.5)*(H-34);
  const wl=nw.length>1?`<path class="cw" d="${nw.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+','+YW(v).toFixed(1)).join('')}"/>`:'';
  let ax='';[0,50,100].forEach(v=>{ax+=`<line class="ax" x1="30" x2="${w-10}" y1="${Y(v)}" y2="${Y(v)}"/><text x="26" y="${Y(v)+3}" text-anchor="end">${v}</text>`;});
  for(let a=0;a<n;a+=n>60?20:10)ax+=`<text x="${X(a)}" y="${H-6}" text-anchor="middle">${a}</text>`;
  return`<svg class="chart curve" viewBox="0 0 ${w} ${H}" role="img" aria-label="一生的曲线">${ax}${wl}${line(h,'ch')}${line(hp,'cp')}${now!=null&&now<n?`<line class="now" x1="${X(now)}" x2="${X(now)}" y1="${Y(100)}" y2="${Y(0)}"/>`:''}</svg>
  <div class="legend"><span><i style="background:var(--red)"></i>幸福</span><span><i style="background:var(--accent)"></i>健康</span><span><i style="background:var(--gold)"></i>财富（相对当地收入）</span></div>`;}

function wirePanel(L,c){

    else if(a==='sell')sellHouse(L);

    else if(a==='medoff'){L.ins.med=false;log(L,'退掉了医疗险。','act');}
    else if(a==='ann'){const pr=L.money.liq*+b.dataset.p,q=annQuote(L,c,pr);L.money.liq-=pr;L.ins.ann+=q.pay;log(L,`用 ${fmtMoney(pr)} 买了终身年金，每年领 ${fmtMoney(q.pay)}。`,'act');}
  });render();});
}

const Music={on:false,ctx:null,out:null,rev:null,iv:null,cur:null,
  init(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;if(this.ctx)return true;const ctx=this.ctx=new AC();

 ling:()=>({title:'虫灾',text:'药园里起了一种啃灵根的虫子。',opts:[opt('一株一株地捉',()=>{X.mood-=2;}),opt('用猛药',()=>{if(rnd()<.4){X.stones=Math.max(0,X.stones-100);xlog('药下得太猛，半个药园都枯了。','work');}})]}),
 shou:()=>({title:'兽潮',text:'山里的妖兽成群往外跑，有人雇驯兽师去引开它们。',opts:[opt('带着灵兽去',()=>{const r=battle(foe(.9),.05);if(r==='dead'){xDie('死于兽潮');return;}if(r==='win'){X.stones+=150*X.job.lvl;if(X.pet)X.pet.lvl+=2;}else{X.hp-=25;addIll(pick(INJ),10,'body');}}),opt('不去',()=>{})]}),
 yi:()=>({title:'求医',text:'一个凡人抱着高烧不退的孩子跪在你门口，身上一块灵石也没有。',opts:[opt('治',()=>{X.mood+=8;X.fame+=2;xlog('孩子的烧退了。那人磕了三个头才走。','work');}),opt('收了诊金再治',()=>{X.stones+=5;X.mood-=4;})]}),
 shang:()=>({title:'一批货',text:'有人低价出一批“上古灵材”，说是急着用钱。',opts:[opt('吃下',()=>{if(rnd()<.5){X.stones+=400*X.job.lvl;xlog('是真货，你转手赚了一大笔。','money');}else{X.stones=Math.max(0,X.stones-300*X.job.lvl);xlog('是假货，你被骗了。','money');}}),opt('不碰',()=>{})]}),
 lie:()=>{const en=foe(1.2),p=power()/(power()+en);return{title:'悬赏',text:`悬赏榜上挂着一个劫修的人头，赏金很高。胜算约 ${Math.round(p*100)}%。`,opts:[opt('接',()=>{const r=battle(en,.12);if(r==='dead'){xDie('死于追捕悬赏');return;}if(r==='win'){X.stones+=200*X.job.lvl*(1+X.realm*.5);X.kills++;}else{X.hp-=30;addIll(pick(INJ),15,'body');}}),opt('不接',()=>{})]};}};
// ---------- 需求（随境界变化） ----------
// weights change with realm: mortals care about food, money and family; high cultivators care about resources, dao heart and longevity
function needW(){const r=X.realm;return r<=1?{res:.25,body:.25,safe:.15,love:.2,est:.1,dao:.05}:r<=3?{res:.25,body:.1,safe:.15,love:.15,est:.15,dao:.2}:{res:.25,body:.05,safe:.1,love:.08,est:.12,dao:.4};}
function upkeep(){return X.realm<=1?0:Math.round(8*Math.pow(X.realm,2.2));} // 灵石 / 年
function computeXNeeds(){const r=X.realm,U=upkeep(),N={};
  N.res=r<=1?clamp(40+X.attr.fam*4+Math.log10(X.stones+1)*12,0,100):clamp(55+22*Math.log10((X.stones+X.pills*20+1)/(U*10+1)),0,100);
  N.body=r>=2?clamp(X.hp-illSum('body')*.6,0,100):clamp(X.hp*.7+(X.stones>20?25:10)-illSum('body')*.6,0,100);
  N.safe=clamp(60+(inSect()?15:0)-(isDemon()?10:0)-(X.flags.hunted?20:0)+Math.min(20,(power()-(X.realm*120+60))/20)-(X.kills>8?10:0),0,100);
  const fam=['f','m'].filter(k=>X.parents[k]).length;
  N.love=clamp(25+(X.partner?30:0)+(inSect()?10:0)+Math.min(15,X.disciples*5)+(X.pet?10:0)+(r<=1?fam*8+X.kids*5:0)+(X.ring===2?5:0),0,100);
  N.est=clamp(20+X.fame*1.2+X.rank*8+r*5+(X.job?X.job.lvl*3:0),0,100);
  N.dao=clamp(70-illSum('mind')-(X.flags.heart||0)*8-Math.max(0,X.kills-3)*2+X.attr.wis*1.5+(has('xin')?20:0)-(X.age>X.life*.9?15:0),0,100);
  X.need=N;const W=needW();let m=0;for(const k in W)m+=W[k]*N[k];X.needMix=m;return N;}
// ---------- hooks ----------
const _xStepM=xStep;
xStep=function(){
  if(!X.alive||X.queue.length)return _xStepM();
  X.ills=X.ills||[];if(X.focus==='heal'&&!X.ills.length)X.focus='cult';const age0=X.age;
  _xStepM();if(!X.alive)return;
  const yrs=Math.max(1,X.age-age0);
  // upkeep: cultivation burns spirit stones; if you can't pay, progress is slower (applied next turn)
  const U=upkeep()*yrs*(X.focus==='cult'?1:.4);if(U){if(X.stones>=U){X.stones-=U;X.flags.poor=0;}else{X.stones=0;if(!X.flags.poor)xlog('灵石见底了。没有灵石，修炼慢得像在泥里走。','money');X.flags.poor=1;}}
  // professions
  if(X.job){if(X.focus==='earn'){const inc=profInc(yrs);X.stones+=inc;X.job.xp+=yrs*(1+X.attr.wis*.05);if(X.job.k==='dan')X.pills+=Math.round(X.job.lvl*yrs*.5);if(X.job.k==='qi'&&rnd()<.03*X.job.lvl)X.arts++;}
    else X.job.xp+=yrs*.2;
    const nx=X.job.lvl+1;if(nx<=9&&X.job.xp>=nx*nx*2&&!X.queue.length&&rnd()<.6){X.job.xp=0;xQueue(evProfExam());}
    else if(!X.queue.length&&rnd()<.12)xQueue(PEV[X.job.k]());}
  else if(X.realm>=1&&(inSect()||X.sect==='rogue')&&!(X.flags.noProf>X.age)&&!X.queue.length&&(X.focus==='earn'||rnd()<.12)){const ev=evLearnProf();if(ev)xQueue(ev);}
  // healing
  const heal=yrs*(1+X.realm*.5)*(X.focus==='heal'?4:1)*(X.job&&X.job.k==='yi'?2:1)*(X.sect==='xuandan'?1.3:1)*(gongOf('b').length?1.3:1);
  if(X.focus==='heal'&&X.pills>0&&X.ills.length){const u=Math.min(X.pills,2+yrs);X.pills-=u;healIlls(heal+u*3,'服丹调养之后');}else healIlls(heal*.5,X.ills.length?'慢慢调养':null);
  if(X.ills.length)X.hp=Math.min(X.hp,hpMax());
  // mortal aging and sickness before foundation
  if(X.realm<=1&&X.age>50&&rnd()<.08*yrs)addIll(pick(['咳疾','腰腿痛','眼花','心口疼']),6,'body');
  // severe wounds can kill
  if(illSum('body')>70&&rnd()<.1){xDie(`伤病缠身，${pick(X.ills).n}终于要了命`);return;}
  // needs → mood (心境)
  computeXNeeds();X.mood+=(X.needMix-X.mood)*.25;X.mood=clamp(X.mood,0,100);
};
// growth penalty: poverty, injuries, low dao heart
const _mainMult=mainMult;
mainMult=function(){let m=_mainMult();if(X.flags.poor)m*=.55;m*=1-Math.min(.5,illSum('body')/150+illSum('mind')/100);return m;};
// breakthroughs heal the body; foundation cures mortal illnesses
const _xBreak=xBreak;
xBreak=function(p){const r0=X.realm;_xBreak(p);if(!X.alive)return;
  if(X.realm>r0){const old=(X.ills||[]).filter(i=>i.cure!=null&&X.realm>=i.cure).map(i=>i.n);X.ills=(X.ills||[]).filter(i=>!(i.cure!=null&&X.realm>=i.cure));
    if(old.length)xlog(`脱胎换骨，${old.join('、')}——那些在人间治不好的病，就这样好了。`,'health');
    healIlls(30+X.realm*10,'突破时灵气冲刷全身',true);
    if(X.realm===2)xlog('筑基之后，你不再需要吃饭，也很少需要睡觉了。','era');
    if(X.realm===4)xlog('元婴已成，就算肉身毁了，也还有一线生机。','era');}
  else{addIll('经脉受损',15,'body');if(rnd()<.4)addIll('道心裂痕',12,'mind');}};
const _battle=battle;
battle=function(enemy,deathP){const r=_battle(enemy,deathP);if(r==='lose')addIll(pick(INJ),8+X.realm*2,'body');return r;};
const _evHeart=evHeart;
evHeart=function(){const e=_evHeart();const f=e.opts[0].f;e.opts[0].f=()=>{const m0=X.mood;f();if(X.mood<m0)addIll('心魔余毒',15,'mind');else healIlls(20,null);};e.opts[1].f=(f2=>()=>{f2();addIll('心结',8,'mind');})(e.opts[1].f);return e;};
// coming from the ordinary world: bring old illnesses along
const _xFromLife=xFromLife;
xFromLife=function(L){_xFromLife(L);X.ills=[];
  if(L.chronic>0)addIll('人间带来的旧疾',clamp(Math.round(L.chronic*.6),5,35),'body',2);
  if(L.flags.disabled)addIll('旧伤落下的残疾',20,'body',4);
  if(L.flags.dep||(L.st.mind!=null&&L.st.mind<40))addIll('抑郁',15,'mind');
  if(L.st.health<50)addIll('体虚',10,'body',1);
  if(X.ills.length)xlog(`你身上还带着人间的病：${X.ills.map(i=>i.n).join('、')}。领你来的人说，修到筑基，大多都能好。`,'health');};
// UI
const XN=[['res','资源','灵石、丹药够不够用；境界越高，修炼越烧灵石','凡人时是吃穿用度'],['body','身体','气血和伤病','筑基后辟谷，不再需要吃饭'],['safe','安全','有没有靠山，打不打得过找上门的人',''],['love','归属','道侣、师门、徒弟、灵兽','凡人时还有父母儿女'],['est','尊重','名望、门中地位、手艺品级',''],['dao','道心','心魔、杀孽、对寿元将尽的恐惧','境界越高越重要']];
const _xRender=xRender;
xRender=function(){_xRender();if(!X||G.page!=='xgame')return;if(!X.need)computeXNeeds();const W=needW(),N=X.need;
  if(X.ills&&X.ills.length){const s=$('#xStats');if(s)s.insertAdjacentHTML('beforeend',`<span class="ms low"><i>伤病</i><b>${X.ills.map(i=>i.n).join('、')}</b></span>`);}
  if(!XG.more)return;
  const bag=$('#xBag');if(bag&&(X.realm>=1||X.job)){bag.insertAdjacentHTML('beforeend',`${X.realm>=2?`<p class="xs muted">修炼每年要烧掉约 ${upkeep()} 灵石${X.flags.poor?'，你现在付不起，修炼变慢了':''}。</p>`:''}${X.job?`<p class="small">手艺：<b>${profName()}</b>（九品最高）· 专心做一段时间，大约每年 ${profInc(1)} 灵石</p>`:''}
   <h4 style="margin-top:14px">心境从哪里来 · 现在 ${Math.round(X.needMix||X.mood)}</h4><div class="needs">${XN.map(([k,n,d,alt])=>`<div class="nrow"><div class="nn"><b>${n} · 占 ${Math.round(W[k]*100)}%</b><span class="xs muted">${k==='res'&&X.realm<=1?alt:k==='body'&&X.realm>=2?alt:k==='love'&&X.realm<=1?alt:d}</span></div>${bar(N[k])}<span class="num">${Math.round(N[k])}</span><span></span></div>`).join('')}</div>
   <p class="xs muted">${X.realm<=1?'还是凡人的时候，吃饱穿暖和家人最要紧。':X.realm<=3?'入了道，吃饭睡觉不再要紧，修炼资源和道心越来越重要。':'到了这个境界，凡俗的事几乎都放下了，道心占了大半。'}</p>`);}
};
const _pXend=pXend;
pXend=function(){let h=_pXend();if(X.job)h=h.replace('</p>\n   <div><span class="big-stat">',`${profName()}。</p>\n   <div><span class="big-stat">`);return h;};

window.__lifeTable={Music,PIECES,hz};
route('home');
})();
</script>
